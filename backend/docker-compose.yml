services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override local memory limiter with shared Redis in multi-worker prod
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis

volumes:
  redis-data:
